<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KyuuApi</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        blood: { 50: '#fef2f2', 100: '#fee2e2', 200: '#fecaca', 300: '#fca5a5', 400: '#f87171', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c', 800: '#991b1b', 900: '#7f1d1d' },
                        gold: { 50: '#fefce8', 100: '#fef9c3', 200: '#fef08a', 300: '#fde047', 400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207', 800: '#854d0e', 900: '#713f12' },
                        dark: { bg: '#0a0a0f', surface: '#14141e', card: '#1a1a2e' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen p-4" style="background: #0a0a0f;">

    <!-- Background Glow -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-blood-600/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 right-0 w-[400px] h-[400px] bg-gold-500/5 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/3 left-0 w-[300px] h-[300px] bg-blood-500/5 rounded-full blur-3xl"></div>
    </div>

    <!-- Blood Rain (decorative) -->
    <div id="bloodRain" class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <style>
            .blood-drop {
                position: absolute;
                width: 2px;
                height: 15px;
                background: linear-gradient(180deg, transparent, rgba(220, 38, 38, 0.4));
                animation: bloodFall linear infinite;
                opacity: 0;
            }
            @keyframes bloodFall {
                0% { transform: translateY(-20px); opacity: 0; }
                10% { opacity: 0.5; }
                90% { opacity: 0.5; }
                100% { transform: translateY(110vh); opacity: 0; }
            }
        </style>
        <script>
            (function() {
                const container = document.getElementById('bloodRain');
                for (let i = 0; i < 30; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'blood-drop';
                    drop.style.left = Math.random() * 100 + '%';
                    drop.style.height = (8 + Math.random() * 20) + 'px';
                    drop.style.animationDuration = (5 + Math.random() * 10) + 's';
                    drop.style.animationDelay = (Math.random() * 10) + 's';
                    drop.style.opacity = 0.1 + Math.random() * 0.3;
                    container.appendChild(drop);
                }
            })();
        </script>
    </div>

    <!-- Auth Container -->
    <div class="relative z-10 w-full max-w-md">
        <div class="text-center mb-8">
            <a href="index.html" class="text-3xl font-black flex items-center justify-center gap-2">
                <span class="text-blood-500">Kyuu</span>
                <span class="text-gold-400">Api</span>
            </a>
            <p class="text-gray-500 text-sm mt-2 font-medium">Platform REST API Premium</p>
        </div>

        <!-- Auth Card -->
        <div class="glass rounded-3xl p-6 sm:p-8 border border-blood-500/20 blood-glow">
            <!-- Tab Login/Register -->
            <div class="flex bg-black/30 rounded-2xl p-1 mb-6">
                <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2.5 rounded-xl text-sm font-bold transition-all bg-blood-600 text-white">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Login
                </button>
                <button id="tab-register" onclick="switchTab('register')" class="flex-1 py-2.5 rounded-xl text-sm font-bold transition-all text-gray-400 hover:text-white">
                    <i class="fa-solid fa-user-plus mr-2"></i> Daftar
                </button>
            </div>

            <!-- Login Form -->
            <div id="login-form">
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1.5">Email</label>
                        <input type="email" id="login-email" placeholder="email@example.com" class="input-blood" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1.5">Password</label>
                        <input type="password" id="login-password" placeholder="••••••••" class="input-blood" required>
                    </div>
                    <button type="submit" class="btn-blood w-full text-sm py-3.5">
                        <i class="fa-solid fa-right-to-bracket mr-2"></i> Masuk
                    </button>
                    <p class="text-center text-xs text-gray-500 mt-3">
                        Belum punya akun? <button type="button" onclick="switchTab('register')" class="text-gold-400 hover:text-gold-300 font-bold">Daftar di sini</button>
                    </p>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="hidden">
                <form onsubmit="handleRegister(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1.5">Nama Lengkap</label>
                        <input type="text" id="register-name" placeholder="Nama kamu" class="input-blood" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1.5">Email</label>
                        <input type="email" id="register-email" placeholder="email@example.com" class="input-blood" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1.5">Password</label>
                        <input type="password" id="register-password" placeholder="Minimal 6 karakter" class="input-blood" required minlength="6">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-1.5">Username / User ID</label>
                        <input type="text" id="register-userid" placeholder="Contoh: kyuuxx" class="input-blood" required>
                        <p class="text-[10px] text-gray-500 mt-1">Digunakan sebagai ID unik (contoh: #kyuuxx)</p>
                    </div>
                    <button type="submit" class="btn-gold w-full text-sm py-3.5">
                        <i class="fa-solid fa-user-plus mr-2"></i> Daftar Sekarang
                    </button>
                    <p class="text-center text-xs text-gray-500 mt-3">
                        Sudah punya akun? <button type="button" onclick="switchTab('login')" class="text-blood-400 hover:text-blood-300 font-bold">Login di sini</button>
                    </p>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-[10px] text-gray-600 mt-6 tracking-widest">
            &copy; 2026 KyuuApi — Dark Blood Edition
        </p>
    </div>

    <script>
        // ==============================
        // AUTH LOGIC WITH SUPABASE
        // ==============================

        const supabase = supabaseClient;

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.className = 'flex-1 py-2.5 rounded-xl text-sm font-bold transition-all bg-blood-600 text-white';
                tabRegister.className = 'flex-1 py-2.5 rounded-xl text-sm font-bold transition-all text-gray-400 hover:text-white';
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.className = 'flex-1 py-2.5 rounded-xl text-sm font-bold transition-all bg-gold-600 text-white';
                tabLogin.className = 'flex-1 py-2.5 rounded-xl text-sm font-bold transition-all text-gray-400 hover:text-white';
            }
        }

        // ===== LOGIN =====
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memproses...';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });

                if (error) {
                    alert('❌ Login gagal: ' + error.message);
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i> Masuk';
                    btn.disabled = false;
                    return;
                }

                if (data.session) {
                    // Cek profile
                    const { data: profile } = await supabase
                        .from('profiles')
                        .select('*')
                        .eq('id', data.user.id)
                        .single();

                    if (!profile) {
                        // Buat profile jika belum ada
                        await supabase.from('profiles').insert({
                            id: data.user.id,
                            full_name: data.user.user_metadata?.full_name || 'User',
                            user_id: data.user.user_metadata?.username || 'user_' + Math.floor(Math.random() * 10000),
                            email: data.user.email,
                            plan: 'free',
                            role: 'member',
                            exp: 0,
                            level: 1,
                            requests_today: 0,
                            api_key: 'kyuu_' + Math.random().toString(36).substring(2, 10)
                        });
                    }

                    window.location.href = 'home.html';
                }
            } catch (err) {
                alert('Terjadi kesalahan: ' + err.message);
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i> Masuk';
                btn.disabled = false;
            }
        }

        // ===== REGISTER =====
        async function handleRegister(e) {
            e.preventDefault();
            const fullName = document.getElementById('register-name').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;
            const userId = document.getElementById('register-userid').value.trim();

            if (!userId) {
                alert('Username harus diisi!');
                return;
            }

            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Mendaftar...';

            try {
                // Cek apakah user_id sudah ada
                const { data: existing } = await supabase
                    .from('profiles')
                    .select('user_id')
                    .eq('user_id', userId)
                    .maybeSingle();

                if (existing) {
                    alert('❌ Username "' + userId + '" sudah digunakan!');
                    btn.innerHTML = '<i class="fa-solid fa-user-plus mr-2"></i> Daftar Sekarang';
                    btn.disabled = false;
                    return;
                }

                // Register ke Supabase Auth
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            full_name: fullName,
                            username: userId
                        }
                    }
                });

                if (error) {
                    alert('❌ Gagal mendaftar: ' + error.message);
                    btn.innerHTML = '<i class="fa-solid fa-user-plus mr-2"></i> Daftar Sekarang';
                    btn.disabled = false;
                    return;
                }

                if (data.user) {
                    // Buat profile di database
                    const { error: profileError } = await supabase
                        .from('profiles')
                        .insert({
                            id: data.user.id,
                            full_name: fullName,
                            user_id: userId,
                            email: email,
                            plan: 'free',
                            role: 'member',
                            exp: 0,
                            level: 1,
                            requests_today: 0,
                            api_key: 'kyuu_' + Math.random().toString(36).substring(2, 10),
                            avatar_url: 'https://via.placeholder.com/150'
                        });

                    if (profileError) {
                        console.error('Gagal membuat profile:', profileError);
                        alert('Akun terbuat tapi gagal menyimpan profile. Silakan login.');
                    }

                    alert('✅ Pendaftaran berhasil! Silakan login.');
                    switchTab('login');
                    document.getElementById('login-email').value = email;
                    document.getElementById('login-password').value = '';
                }

                btn.innerHTML = '<i class="fa-solid fa-user-plus mr-2"></i> Daftar Sekarang';
                btn.disabled = false;

            } catch (err) {
                alert('Terjadi kesalahan: ' + err.message);
                btn.innerHTML = '<i class="fa-solid fa-user-plus mr-2"></i> Daftar Sekarang';
                btn.disabled = false;
            }
        }

        // Cek session aktif
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'home.html';
            }
        }

        document.addEventListener('DOMContentLoaded', checkSession);
    </script>

</body>
</html>
