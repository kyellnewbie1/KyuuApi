<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KyuuApi</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        blood: { 50: '#fef2f2', 100: '#fee2e2', 200: '#fecaca', 300: '#fca5a5', 400: '#f87171', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c', 800: '#991b1b', 900: '#7f1d1d' },
                        gold: { 50: '#fefce8', 100: '#fef9c3', 200: '#fef08a', 300: '#fde047', 400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207', 800: '#854d0e', 900: '#713f12' },
                        dark: { bg: '#0a0a0f', surface: '#14141e', card: '#1a1a2e' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <!-- LOAD SUPABASE DULUAN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- CONFIG JS -->
    <script src="config.js"></script>
</head>
<body class="flex items-center justify-center min-h-screen p-4" style="background: #0a0a0f;">

    <!-- Background Glow -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-blood-600/10 rounded-full blur-3xl"></div>
        <div class="absolute bottom-0 right-0 w-[400px] h-[400px] bg-gold-500/5 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/3 left-0 w-[300px] h-[300px] bg-blood-500/5 rounded-full blur-3xl"></div>
    </div>

    <!-- Blood Rain -->
    <div id="bloodRain" class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <style>
            .blood-drop {
                position: absolute;
                width: 2px;
                height: 15px;
                background: linear-gradient(180deg, transparent, rgba(220, 38, 38, 0.4));
                animation: bloodFall linear infinite;
                opacity: 0;
            }
            @keyframes bloodFall {
                0% { transform: translateY(-20px); opacity: 0; }
                10% { opacity: 0.5; }
                90% { opacity: 0.5; }
                100% { transform: translateY(110vh); opacity: 0; }
            }
        </style>
        <script>
            (function() {
                const container = document.getElementById('bloodRain');
                for (let i = 0; i < 30; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'blood-drop';
                    drop.style.left = Math.random() * 100 + '%';
                    drop.style.height = (8 + Math.random() * 20) + 'px';
                    drop.style.animationDuration = (5 + Math.random() * 10) + 's';
                    drop.style.animationDelay = (Math.random() * 10) + 's';
                    drop.style.opacity = 0.1 + Math.random() * 0.3;
                    container.appendChild(drop);
                }
            })();
        </script>
    </div>

    <!-- Auth Container -->
    <div class="relative z-10 w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="index.html" class="text-4xl font-black flex items-center justify-center gap-2 no-underline">
                <span class="text-blood-500">Kyuu</span>
                <span class="text-gold-400">Api</span>
            </a>
            <p class="text-gray-500 text-sm mt-2 font-medium tracking-wider">Platform REST API Premium</p>
        </div>

        <!-- Auth Card -->
        <div class="glass rounded-3xl p-6 sm:p-8 border border-blood-500/20 blood-glow">
            
            <!-- Tab Login/Register -->
            <div class="flex bg-black/40 rounded-2xl p-1 mb-6">
                <button id="tab-login" class="flex-1 py-3 rounded-xl text-sm font-bold transition-all duration-300 bg-blood-600 text-white shadow-lg shadow-blood-600/20">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Login
                </button>
                <button id="tab-register" class="flex-1 py-3 rounded-xl text-sm font-bold transition-all duration-300 text-gray-400 hover:text-white">
                    <i class="fa-solid fa-user-plus mr-2"></i> Daftar
                </button>
            </div>

            <!-- ===== LOGIN FORM ===== -->
            <div id="login-form">
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
                            <i class="fa-regular fa-envelope mr-2 text-gold-400"></i> Email
                        </label>
                        <div class="relative">
                            <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input 
                                type="email" 
                                id="login-email" 
                                placeholder="email@example.com" 
                                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 pl-11 text-white placeholder-gray-500 focus:outline-none focus:border-blood-500 focus:ring-2 focus:ring-blood-500/20 transition"
                                value="kaishinaval@gmail.com"
                            >
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
                            <i class="fa-solid fa-key mr-2 text-gold-400"></i> Password
                        </label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input 
                                type="password" 
                                id="login-password" 
                                placeholder="Minimal 6 karakter" 
                                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 pl-11 text-white placeholder-gray-500 focus:outline-none focus:border-blood-500 focus:ring-2 focus:ring-blood-500/20 transition"
                            >
                        </div>
                    </div>

                    <button id="btn-login" class="btn-blood w-full text-sm py-3.5 rounded-xl font-bold flex items-center justify-center gap-2">
                        <i class="fa-solid fa-right-to-bracket"></i> Masuk
                    </button>
                    
                    <p class="text-center text-xs text-gray-500 mt-4">
                        Belum punya akun? 
                        <button id="goto-register" class="text-gold-400 hover:text-gold-300 font-bold transition">
                            Daftar di sini
                        </button>
                    </p>
                </div>
            </div>

            <!-- ===== REGISTER FORM ===== -->
            <div id="register-form" class="hidden">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
                            <i class="fa-regular fa-user mr-2 text-gold-400"></i> Nama Lengkap
                        </label>
                        <div class="relative">
                            <i class="fa-regular fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input 
                                type="text" 
                                id="register-name" 
                                placeholder="Nama kamu" 
                                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 pl-11 text-white placeholder-gray-500 focus:outline-none focus:border-blood-500 focus:ring-2 focus:ring-blood-500/20 transition"
                            >
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
                            <i class="fa-regular fa-envelope mr-2 text-gold-400"></i> Email
                        </label>
                        <div class="relative">
                            <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input 
                                type="email" 
                                id="register-email" 
                                placeholder="email@example.com" 
                                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 pl-11 text-white placeholder-gray-500 focus:outline-none focus:border-blood-500 focus:ring-2 focus:ring-blood-500/20 transition"
                            >
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
                            <i class="fa-solid fa-key mr-2 text-gold-400"></i> Password
                        </label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input 
                                type="password" 
                                id="register-password" 
                                placeholder="Minimal 6 karakter" 
                                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 pl-11 text-white placeholder-gray-500 focus:outline-none focus:border-blood-500 focus:ring-2 focus:ring-blood-500/20 transition"
                            >
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">
                            <i class="fa-regular fa-id-card mr-2 text-gold-400"></i> Username / ID
                        </label>
                        <div class="relative">
                            <i class="fa-regular fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input 
                                type="text" 
                                id="register-userid" 
                                placeholder="Contoh: kyuuxx" 
                                class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3.5 pl-11 text-white placeholder-gray-500 focus:outline-none focus:border-blood-500 focus:ring-2 focus:ring-blood-500/20 transition"
                            >
                        </div>
                        <p class="text-[10px] text-gray-500 mt-1.5">
                            <i class="fa-regular fa-circle-info mr-1"></i> Digunakan sebagai ID unik (contoh: #kyuuxx)
                        </p>
                    </div>

                    <button id="btn-register" class="btn-gold w-full text-sm py-3.5 rounded-xl font-bold flex items-center justify-center gap-2">
                        <i class="fa-solid fa-user-plus"></i> Daftar Sekarang
                    </button>
                    
                    <p class="text-center text-xs text-gray-500 mt-4">
                        Sudah punya akun? 
                        <button id="goto-login" class="text-blood-400 hover:text-blood-300 font-bold transition">
                            Login di sini
                        </button>
                    </p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-[10px] text-gray-600 mt-6 tracking-widest">
            &copy; 2026 KyuuApi — Dark Blood Edition
        </p>
    </div>

    <!-- ============================== -->
    <!-- SCRIPT AUTH LOGIC (FIXED) -->
    <!-- ============================== -->
    <script>
        (function() {
            'use strict';

            console.log('🔐 Auth page loaded');

            // ===== INISIALISASI SUPABASE DENGAN AMAN =====
            let supabase = null;
            
            try {
                // Cek apakah CONFIG tersedia
                if (typeof CONFIG !== 'undefined' && CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY) {
                    console.log('✅ Config found, initializing Supabase...');
                    supabase = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
                    console.log('✅ Supabase initialized successfully');
                } else {
                    console.error('❌ CONFIG not found or incomplete!');
                    alert('❌ Konfigurasi tidak ditemukan. Pastikan config.js sudah diatur dengan benar.');
                    return;
                }
            } catch (err) {
                console.error('❌ Failed to initialize Supabase:', err);
                alert('❌ Gagal menginisialisasi Supabase: ' + err.message);
                return;
            }

            // ===== DOM ELEMENTS =====
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const gotoRegister = document.getElementById('goto-register');
            const gotoLogin = document.getElementById('goto-login');
            const btnLogin = document.getElementById('btn-login');
            const btnRegister = document.getElementById('btn-register');

            // ===== SWITCH TAB =====
            function switchTab(tab) {
                console.log('🔄 Switching to:', tab);
                
                if (tab === 'login') {
                    loginForm.classList.remove('hidden');
                    registerForm.classList.add('hidden');
                    tabLogin.className = 'flex-1 py-3 rounded-xl text-sm font-bold transition-all duration-300 bg-blood-600 text-white shadow-lg shadow-blood-600/20';
                    tabRegister.className = 'flex-1 py-3 rounded-xl text-sm font-bold transition-all duration-300 text-gray-400 hover:text-white';
                } else {
                    loginForm.classList.add('hidden');
                    registerForm.classList.remove('hidden');
                    tabRegister.className = 'flex-1 py-3 rounded-xl text-sm font-bold transition-all duration-300 bg-gold-600 text-white shadow-lg shadow-gold-600/20';
                    tabLogin.className = 'flex-1 py-3 rounded-xl text-sm font-bold transition-all duration-300 text-gray-400 hover:text-white';
                }
            }

            // ===== EVENT LISTENERS =====
            tabLogin.addEventListener('click', function(e) {
                e.preventDefault();
                switchTab('login');
            });

            tabRegister.addEventListener('click', function(e) {
                e.preventDefault();
                switchTab('register');
            });

            gotoRegister.addEventListener('click', function(e) {
                e.preventDefault();
                switchTab('register');
            });

            gotoLogin.addEventListener('click', function(e) {
                e.preventDefault();
                switchTab('login');
            });

            // ===== LOGIN =====
            btnLogin.addEventListener('click', async function(e) {
                e.preventDefault();
                console.log('🔑 Login button clicked');

                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;

                if (!email || !password) {
                    alert('❌ Email dan password harus diisi!');
                    return;
                }

                // Cek supabase tersedia
                if (!supabase) {
                    alert('❌ Supabase tidak tersedia. Silakan refresh halaman.');
                    return;
                }

                const originalText = btnLogin.innerHTML;
                btnLogin.disabled = true;
                btnLogin.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memproses...';

                try {
                    console.log('📧 Attempting login for:', email);
                    
                    const { data, error } = await supabase.auth.signInWithPassword({ 
                        email, 
                        password 
                    });

                    if (error) {
                        console.error('❌ Login error:', error);
                        alert('❌ Login gagal: ' + error.message);
                        btnLogin.innerHTML = originalText;
                        btnLogin.disabled = false;
                        return;
                    }

                    if (data && data.session) {
                        console.log('✅ Login successful!');
                        window.location.href = 'home.html';
                    } else {
                        alert('❌ Login gagal: No session returned');
                        btnLogin.innerHTML = originalText;
                        btnLogin.disabled = false;
                    }

                } catch (err) {
                    console.error('💥 Unexpected error:', err);
                    alert('Terjadi kesalahan: ' + err.message);
                    btnLogin.innerHTML = originalText;
                    btnLogin.disabled = false;
                }
            });

            // ===== REGISTER =====
            btnRegister.addEventListener('click', async function(e) {
                e.preventDefault();
                console.log('📝 Register button clicked');

                const fullName = document.getElementById('register-name').value.trim();
                const email = document.getElementById('register-email').value.trim();
                const password = document.getElementById('register-password').value;
                const userId = document.getElementById('register-userid').value.trim();

                // Validasi
                if (!fullName) {
                    alert('❌ Nama lengkap harus diisi!');
                    return;
                }
                if (!email) {
                    alert('❌ Email harus diisi!');
                    return;
                }
                if (!password || password.length < 6) {
                    alert('❌ Password minimal 6 karakter!');
                    return;
                }
                if (!userId) {
                    alert('❌ Username harus diisi!');
                    return;
                }

                // Cek supabase tersedia
                if (!supabase) {
                    alert('❌ Supabase tidak tersedia. Silakan refresh halaman.');
                    return;
                }

                const originalText = btnRegister.innerHTML;
                btnRegister.disabled = true;
                btnRegister.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Mendaftar...';

                try {
                    // Cek username unik
                    console.log('🔍 Checking username:', userId);
                    const { data: existing, error: checkError } = await supabase
                        .from('profiles')
                        .select('user_id')
                        .eq('user_id', userId)
                        .maybeSingle();

                    if (existing) {
                        alert('❌ Username "' + userId + '" sudah digunakan! Silakan pilih username lain.');
                        btnRegister.innerHTML = originalText;
                        btnRegister.disabled = false;
                        return;
                    }

                    // Register ke Supabase Auth
                    console.log('📧 Registering user:', email);
                    const { data, error } = await supabase.auth.signUp({
                        email,
                        password,
                        options: {
                            data: {
                                full_name: fullName,
                                username: userId
                            }
                        }
                    });

                    if (error) {
                        console.error('❌ Register error:', error);
                        alert('❌ Gagal mendaftar: ' + error.message);
                        btnRegister.innerHTML = originalText;
                        btnRegister.disabled = false;
                        return;
                    }

                    if (data && data.user) {
                        console.log('✅ Registration successful!');
                        alert('✅ Pendaftaran berhasil!\n\nSilakan login menggunakan email dan password kamu.');
                        
                        // Switch ke login
                        switchTab('login');
                        document.getElementById('login-email').value = email;
                        document.getElementById('login-password').value = '';
                    }

                    btnRegister.innerHTML = originalText;
                    btnRegister.disabled = false;

                } catch (err) {
                    console.error('💥 Unexpected error:', err);
                    alert('Terjadi kesalahan: ' + err.message);
                    btnRegister.innerHTML = originalText;
                    btnRegister.disabled = false;
                }
            });

            // ===== ENTER KEY SUPPORT =====
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    if (!loginForm.classList.contains('hidden')) {
                        btnLogin.click();
                    } else if (!registerForm.classList.contains('hidden')) {
                        btnRegister.click();
                    }
                }
            });

            // ===== CEK SESSION =====
            async function checkSession() {
                try {
                    if (!supabase) {
                        console.error('❌ Supabase not available for session check');
                        return;
                    }
                    
                    console.log('🔍 Checking session...');
                    const { data: { session }, error } = await supabase.auth.getSession();
                    
                    if (error) {
                        console.error('❌ Session check error:', error);
                        return;
                    }
                    
                    if (session) {
                        console.log('✅ Session found, redirecting to home...');
                        window.location.href = 'home.html';
                    } else {
                        console.log('ℹ️ No session found');
                    }
                } catch (err) {
                    console.error('💥 Session check error:', err);
                }
            }

            // ===== INIT =====
            // Tunggu sebentar biar semua script loading
            setTimeout(function() {
                checkSession();
            }, 500);
            
            console.log('✅ Auth page ready');

        })();
    </script>

</body>
</html>
